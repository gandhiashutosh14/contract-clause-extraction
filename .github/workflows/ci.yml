name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The suite exercises parsing, pre-filtering, prompts and Excel output with a
      # fake model, so it needs neither torch nor transformers.
      - run: pip install pandas openpyxl python-docx pytest
      - run: pytest -q
